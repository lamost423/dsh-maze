<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Session Trace 迷宫时间线</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --line:#e4e7ee; --txt:#1f2937; --dim:#7a869e;
    --llm:#2563eb; --bash:#0f9488; --grep:#7c3aed; --read:#059669; --web:#d97706; --other:#0891b2;
    --err:#dc2626; --dead:#9aa4b8; --ans:#16a34a; --main-f:#2563eb; --main-p:#7c3aed;
    --milestone:#d97706;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--txt); font:13px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; padding:20px 24px 16px; display:flex; flex-direction:column; overflow:hidden}
  body > :not(#svgwrap){flex-shrink:0}
  h1{font-size:19px; font-weight:650; color:#111827}
  .sub{color:var(--dim); font-size:12px; margin:2px 0 12px}
  #drop{background:#fff; border:2px dashed #c7cedb; border-radius:12px; padding:26px 18px; text-align:center; color:#5b6b85; cursor:pointer; transition:border-color .15s, background .15s}
  #drop.hover{border-color:var(--main-f); background:#f0f5ff}
  #drop b{color:#2563eb}
  .files{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
  .fchip{background:#eef1f6; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:12px; display:flex; align-items:center; gap:8px}
  .fchip .x{cursor:pointer; color:#9aa4b8; font-weight:700; padding:0 2px}
  .fchip .x:hover{color:#dc2626}
  .fchip.err{border-color:#fca5a5; color:#b91c1c; background:#fef2f2}
  .stats{display:flex; gap:10px; flex-wrap:wrap; margin:12px 0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 14px; min-width:210px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card b{font-size:15px}
  .card .m{color:var(--dim); font-size:11px}
  .card .key{color:var(--dim); margin-left:8px; font-size:11px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:8px 0; color:var(--dim); font-size:12px}
  .lg{display:inline-flex; align-items:center; gap:5px}
  .ln{width:20px; height:0; border-top:2px solid #fff; display:inline-block}
  .ln.mf{border-color:var(--main-f)} .ln.mp{border-color:var(--main-p)}
  .ln.dt{border-color:var(--dead); border-top-style:dashed}
  .ln.bk{border-color:#9aa4b8; border-top-style:dotted}
  .sw{width:14px; height:10px; border-radius:2px; display:inline-block}
  .sw.er{background:var(--err)} .sw.de{background:var(--dead)} .sw.an{background:var(--ans)} .sw.ms{background:var(--milestone)}
  .controls{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 14px; margin-bottom:10px; position:sticky; top:0; z-index:50; box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .controls button{background:#fff; color:#1f2937; border:1px solid #d8dce6; border-radius:8px; padding:4px 14px; font-size:13px; cursor:pointer; transition:background .15s}
  .controls button:hover{background:#eef1f6}
  .controls select{background:#fff; color:#1f2937; border:1px solid #d8dce6; border-radius:8px; padding:3px 6px}
  #curTime{font-variant-numeric:tabular-nums; min-width:70px; color:#2563eb; font-weight:600}
  #seek{flex:1}
  /* The maze scales to whatever space is left: viewBox + meet fit, no scrolling in either axis. */
  .svgwrap{overflow:hidden; flex:1 1 0; min-height:120px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:0 1px 4px rgba(16,24,40,.05)}
  #svg{width:100%; height:100%; display:block}
  svg text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
  .node{cursor:pointer}
  .node circle{stroke:#ffffff; stroke-width:1.5}
  .nlabel{font-size:11px; fill:#46536a; pointer-events:none; font-weight:600}
  .dur-label{font-size:9.5px; fill:#98a4b8; pointer-events:none}
  .node-icon{pointer-events:none}
  .back-label{font-size:12px; fill:#9aa4b8; pointer-events:none}
  .seg-label{font-size:10.5px; font-weight:700; pointer-events:none}
  .band-label{font-size:11px; fill:#b91c1c; pointer-events:none; font-weight:600}
  .hl-path{stroke-width:4.5!important; filter:drop-shadow(0 0 3px rgba(16,24,40,.18))}
  .hl-node circle{stroke:#1f2937!important; stroke-width:2.5!important}
  .hl-node .nlabel{fill:#111827!important}
  .lane-name{font-size:14px; font-weight:700}
  .lane-info{font-size:11px; fill:#7a869e; font-weight:500}
  .tick{font-size:10px; fill:#9aa4b8}
  .tick.big{fill:#5b6b85}
  .mk-flag{font-size:12px}
  .msline{stroke:var(--milestone); stroke-dasharray:4 4; stroke-width:1.5}
  .mslabel{font-size:10.5px; fill:#92400e}
  .msbox{fill:#fff7ed; stroke:#fcd34d; stroke-width:1; rx:4}
  .deadX{font-size:13px; font-weight:700}
  #tip{position:fixed; z-index:100; max-width:600px; max-height:360px; overflow:auto; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:11.5px; display:none; box-shadow:0 8px 28px rgba(16,24,40,.14)}
  #tip .th{color:#2563eb; font-weight:600; margin-bottom:4px}
  #tip pre{white-space:pre-wrap; word-break:break-all; color:#374151; font-family:ui-monospace,Menlo,monospace; font-size:11px}
  #tip .rs{margin-top:5px; color:var(--dim)}
  #tip .back{margin-top:4px; color:#d97706}
  .errbar{background:#fef2f2; border:1px solid #fca5a5; color:#b91c1c; border-radius:10px; padding:10px 14px; margin:10px 0; font-size:12.5px; display:none}
  /* Live (embedded tab) mode: page chrome off, everything tight — the lane band already carries the stats. */
  body.live{padding:4px 8px 8px}
  body.live h1, body.live .sub, body.live #stats{display:none}
  body.live .legend{margin:2px 0 4px; font-size:11px; gap:10px}
  body.live .controls{margin-bottom:4px; padding:4px 10px}
</style>
</head>
<body>
<h1>DSH Session Trace 迷宫时间线</h1>
<div class="sub">上传 1 个 session log（.jsonl / .jsonl.zstd）单独展示，或 2 个进行同时间轴对比。实线 = 主干路径，虚线 = 探索支路，✗/· 后折返；悬停节点查看命令与返回内容。</div>

<div id="drop">
  <b>点击选择或拖拽</b> 1~2 个 session log（.jsonl / .json / .jsonl.zstd）<br>
  <span style="color:#9aa4b8">上传 1 个文件 → 单会话展示；上传 2 个文件 → 同时间轴对比；.zstd 压缩文件由浏览器直接解压；按内容识别格式，文件名任意（如 macOS 副本「xxx.jsonl 2」）</span>
</div>
<!-- No accept filter: names like "xxx.jsonl 2" (macOS duplicates) must stay selectable; format is detected from content. -->
<input type="file" id="file" multiple hidden>
<div class="files" id="files"></div>
<div class="errbar" id="errbar"></div>

<div class="stats" id="stats"></div>
<!-- Populated per render: entries reflect the actual lane count, models, and milestone presence. -->
<div class="legend" id="legend" style="display:none"></div>

<div class="controls" id="controls" style="display:none">
  <button id="btnPlay">▶ 播放</button>
  <button id="btnReset">⟲</button>
  <select id="speed">
    <option value="1">1×</option><option value="5">5×</option>
    <option value="10">10×</option><option value="25" selected>25×</option>
    <option value="50">50×</option><option value="100">100×</option>
    <option value="300">300×</option>
  </select>
  <span id="curTime">0.0s</span>
  <input type="range" id="seek" min="0" max="1000" value="0">
</div>

<div class="svgwrap" id="svgwrap" style="display:none">
<svg id="svg" viewBox="0 0 1560 1150" preserveAspectRatio="xMidYMin meet"></svg>
</div>
<div id="tip"></div>

<script>/*__FZSTD_UMD__*/</script>
<script>
'use strict'
/* ============================ 解析：JSONL → lanes ============================ */
const MODEL_LIKE = /"data"\s*:\s*\[/  // heuristic for "returned model list" results

function tOf(e){ return e.time ?? e.time0 ?? e.createdAt }

/** Format seconds for axis/stat labels: 49252 → "13.7h", 340 → "6m", 42.5 → "42.5s". */
function fmtT(t){
  if (t >= 3600) return (t / 3600).toFixed(t >= 36000 ? 0 : 1) + 'h'
  if (t >= 120) return Math.round(t / 60) + 'm'
  return (Math.round(t * 10) / 10) + 's'
}

/** Axis tick interval keeping ≤50 gridlines regardless of session length. */
function tickStep(T){
  for (const s of [30, 60, 120, 300, 600, 1800, 3600, 7200, 14400, 43200]){
    if (T / s <= 50) return s
  }
  return 86400
}

/** True if any nested tool-result block carries isError (session log v2 nests it per block). */
function hasErrorFlag(x){
  if (Array.isArray(x)) return x.some(hasErrorFlag)
  if (x && typeof x === 'object'){
    if (x.isError === true) return true
    return Object.values(x).some(hasErrorFlag)
  }
  return false
}

function resultText(d){
  const out = []
  const walk = x => {
    if (Array.isArray(x)){ x.forEach(walk); return }
    if (x && typeof x === 'object'){
      if (x.type === 'text') out.push(x.text ?? '')
      else Object.values(x).forEach(walk)
    }
  }
  walk(d.message ?? d)
  return out.join('')
}

function argSummary(argumentsRaw){
  let a
  try { a = JSON.parse(argumentsRaw) } catch { return String(argumentsRaw ?? '') }
  if (a && typeof a === 'object'){
    if (typeof a.command === 'string') return a.command
    if (typeof a.file_path === 'string') return a.file_path
    if (typeof a.pattern === 'string'){
      let s = 'pattern=' + a.pattern
      if (a.path) s += ' path=' + a.path
      return s
    }
    if (typeof a.query === 'string') return a.query
    return JSON.stringify(a)
  }
  return JSON.stringify(a)
}

/** One session log → rows of steps with tool events, verdicts, reasoning stats. */
function buildLane(text){
  const evs = []
  for (const line of text.split(/\r?\n/)){
    const l = line.trim()
    if (!l) continue
    try { evs.push(JSON.parse(l)) } catch { /* skip malformed lines */ }
  }
  if (evs.length === 0) throw new Error('文件不是有效的 JSONL（每行一个 JSON 对象）')
  const first = evs.find(e => e.type === 'user/message')
  const t0 = first !== undefined ? tOf(first) : tOf(evs[0])
  const rows = []
  let cur = null
  const pending = []
  for (const e of evs){
    const t = e.type
    const d = e.data ?? {}
    const tm = (tOf(e) - t0) / 1000
    if (t === 'step/start'){
      // step numbers restart every turn; qualify with the turn so identity stays unique
      cur = { step: d.turn != null ? d.turn + '·' + d.step : d.step, s: tm, e: tm, events: [], rz: 0, rzTxt: '' }
      rows.push(cur)
    } else if (t === 'step/end' && cur !== null){
      cur.e = tm
    } else if (t === 'reasoning-chunks' && cur !== null){
      const texts = d.texts ?? []
      cur.rz += texts.length
      cur.rzTxt += texts.join('')
    } else if (t === 'tool/call' && cur !== null){
      const ev = { k: 't', name: d.name ?? '?', s: tm, e: tm, args: argSummary(d.arguments) }
      cur.events.push(ev)
      pending.push(ev)
    } else if (t === 'tool/result' && pending.length > 0){
      const ev = pending.shift()
      ev.e = tm
      ev.res = resultText(d).replace(/\s+/g, ' ').trim()
      ev.err = d.isError === true || hasErrorFlag(d)
    }
  }
  const modelHeader = evs.find(e => e.type === 'request/header')
  const model = modelHeader?.data?.header?.config?.model ?? null
  for (const r of rows){
    r.rzTxt = r.rzTxt.replace(/\s+/g, ' ').trim().slice(0, 240)
    for (const ev of r.events){
      ev.dur = Math.round((ev.e - ev.s) * 10) / 10
      ev.s = Math.round(ev.s * 10) / 10
      ev.e = Math.round(ev.e * 10) / 10
      ev.res = ev.res.slice(0, 380)
    }
    r.s = Math.round(r.s * 10) / 10
    r.e = Math.round(r.e * 10) / 10
  }
  return { rows, model, title: model ?? (rows.length ? 'Session' : '?') }
}

/** Verdict per tool event: error / deadend / neutral / ok (generic heuristics). */
function toolVerdict(ev){
  if (ev.err) return 'error'
  const txt = ev.res ?? ''
  if (/No such container|Invalid token|HTTP 40\d|HTTP 50\d|^Error:|raw output|does not match|No such file/i.test(txt)) return 'error'
  if (txt.length < 60 || txt === '---' || txt === '') return 'deadend'
  return 'ok'
}

const SEV = { error: 3, deadend: 2, neutral: 1, ok: 0 }
function stepVerdict(evs){
  let v = 'ok'
  for (const ev of evs){
    const s = toolVerdict(ev)
    if (SEV[s] > SEV[v]) v = s
  }
  return v
}

function buildData(fileTexts){
  const lanes = fileTexts.map((text, i) => {
    const { rows, model } = buildLane(text)
    const main = []
    const detours = []
    let lastMain = null
    for (const r of rows){
      const v = r.events.length === 0 ? 'answer' : stepVerdict(r.events)
      const node = { step: r.step, s: r.s, e: r.e, tools: r.events, rz: r.rz, rzTxt: r.rzTxt, v }
      if (v === 'ok' || v === 'answer'){
        main.push(node); lastMain = node
      } else {
        detours.push({ step: r.step, s: r.s, e: r.e, tools: r.events, rz: r.rz, rzTxt: r.rzTxt, v, attach: lastMain ? lastMain.step : 0 })
      }
    }
    if (main.length === 0) throw new Error('没有可解析的有效步骤（step/start 事件缺失？）')
    const tools = rows.reduce((n, r) => n + r.events.length, 0)
    const rz = rows.reduce((n, r) => n + r.rz, 0)
    const T = Math.round(rows[rows.length - 1].e * 10) / 10
    // milestone heuristic: first tool result that looks like a model list
    let mlist = null
    outer: for (const r of rows){
      for (const ev of r.events){
        if (ev.res && MODEL_LIKE.test(ev.res) && /model/i.test(ev.res) && /"id"/.test(ev.res)){
          mlist = ev.e; break outer
        }
      }
    }
    return { key: 'l' + (i + 1), model, rows, main, detours, stats: { steps: rows.length, tools, rz, T, main: main.length, detours: detours.length }, mlist }
  })
  const Tmax = Math.max(...lanes.map(l => l.stats.T), 460)
  const milestones = []
  for (const kind of ['mlist', 'finish']){
    const ts = lanes.map(l => kind === 'mlist' ? l.mlist : l.stats.T)
    if (ts.some(t => t === null)) continue
    milestones.push({
      id: 'm' + (milestones.length + 1),
      label: kind === 'mlist' ? '模型列表结果' : '完成',
      flashT: ts[0], proT: ts[1],
    })
  }
  return { Tmax, milestones, lanes }
}

/* ==================== 空闲折叠：对话间等待压成细缝 ==================== */
const IDLE_MIN = 60   // 无活动超过此秒数的区间视为等待，折叠显示

/**
 * Collapse idle stretches (no step/tool activity in any lane) into thin seams.
 * Mutates node/tool times into compressed coordinates, sets data.Tmax to the
 * compressed span, and attaches data.timeMap { segments, gaps, seam } for the
 * axis and for wall-clock display. Durations and stats stay wall-clock.
 */
function compressTimeline(data){
  const iv = []
  for (const l of data.lanes){
    for (const arr of [l.main, l.detours]){
      for (const n of arr){
        iv.push([n.s, Math.max(n.e, n.s)])
        for (const tl of n.tools ?? []){
          if (tl.s != null) iv.push([tl.s, Math.max(tl.e ?? tl.s, tl.s)])
        }
      }
    }
  }
  data.timeMap = null
  if (iv.length === 0) return
  iv.sort((a, b) => a[0] - b[0])
  const act = []
  for (const [s, e] of iv){
    const last = act[act.length - 1]
    if (last && s <= last[1] + IDLE_MIN) last[1] = Math.max(last[1], e)
    else act.push([s, e])
  }
  if (act.length <= 1) return
  const active = act.reduce((n, [s, e]) => n + (e - s), 0)
  const seam = Math.min(30, Math.max(1, Math.round(active * 0.015 * 10) / 10))
  const segments = []
  const gaps = []
  let c = Math.min(act[0][0], IDLE_MIN)
  for (let i = 0; i < act.length; i++){
    const [rs, re] = act[i]
    segments.push({ rs, re, cs: c })
    c += re - rs
    if (i < act.length - 1){
      gaps.push({ c, skipped: act[i + 1][0] - re })
      c += seam
    }
  }
  const map = t => {
    if (t <= segments[0].rs) return segments[0].cs - (segments[0].rs - t)
    for (let i = segments.length - 1; i >= 0; i--){
      const g = segments[i]
      if (t < g.rs) continue
      if (t <= g.re) return g.cs + (t - g.rs)
      const next = segments[i + 1]
      const gapLen = next ? next.rs - g.re : 1
      return g.cs + (g.re - g.rs) + Math.min(1, (t - g.re) / gapLen) * seam
    }
    return t
  }
  const seen = new Set()
  const remap = n => {
    if (seen.has(n)) return
    seen.add(n)
    n.s = map(n.s)
    n.e = map(n.e)
    for (const tl of n.tools ?? []){
      if (seen.has(tl)) continue
      seen.add(tl)
      if (tl.s != null) tl.s = map(tl.s)
      if (tl.e != null) tl.e = map(tl.e)
    }
  }
  for (const l of data.lanes){
    l.main.forEach(remap)
    l.detours.forEach(remap)
    if (l.mlist != null) l.mlist = map(l.mlist)
  }
  for (const m of data.milestones ?? []){
    m.flashT = map(m.flashT)
    m.proT = map(m.proT)
  }
  data.Tmax = Math.max(c, 60)
  data.timeMap = { segments, gaps, seam }
}

/** Compressed time → wall-clock seconds (for the playback clock). */
function wallClock(t){
  if (!DATA || !DATA.timeMap) return t
  const segs = DATA.timeMap.segments
  for (let i = segs.length - 1; i >= 0; i--){
    const g = segs[i]
    if (t >= g.cs) return Math.min(g.re, g.rs + (t - g.cs))
  }
  return t
}

/* ============================ 布局 ============================ */
const X0 = 56, AXIS_W = 1500
const x = t => X0 + (t / TMAX) * AXIS_W
let TMAX = 460
let LAYOUT = {}
let LANE_GAP = 40

function computeLayout(lanes){
  // Lane geometry grows with the detour count so no curve can leave the canvas:
  // mainY sits below the band header plus all up-detour lanes, regionBottom
  // clears all down-detour lanes, and the next lane starts below that.
  const layout = {}
  let regionTop = 34
  lanes.forEach(l => {
    const up = Math.ceil(l.detours.length / 2)
    const down = Math.floor(l.detours.length / 2)
    const mainY = regionTop + 34 + up * LANE_GAP + 48
    const regionBottom = mainY + down * LANE_GAP + 58
    layout[l.key] = { top: regionTop + 24, mainY, up, down, regionTop, regionBottom }
    regionTop = regionBottom + 66
  })
  return layout
}

/* ============================ 渲染 ============================ */
const svg = document.getElementById('svg')
const NS = 'http://www.w3.org/2000/svg'
const MAIN_COLOR = { l1: '#2563eb', l2: '#7c3aed' }
const VCOLOR = { error: '#dc2626', deadend: '#9aa4b8', neutral: '#b6c0d2', ok: '#16a34a', answer: '#16a34a' }
const TOOL_LABEL = { bash: 'bash', grep: 'grep', read: 'read', web_search: 'web', python3: 'python', curl: 'curl' }
const tlabel = n => TOOL_LABEL[n] ?? n
const vlabel = v => ({ error: '失败 ✗', deadend: '死路 ·', neutral: '低价值', ok: '成功', answer: '回答' }[v] ?? v)
const laneName = lane => DATA.lanes.length === 1 ? '当前会话' : (lane.key === 'l1' ? '第 1 会话' : '第 2 会话')

/** Rebuild the legend from the rendered data: lane entries, then verdict swatches. */
function renderLegend(){
  const lg = []
  if (DATA.lanes.length === 1){
    const m = DATA.lanes[0].model
    lg.push(`<span class="lg"><span class="ln mf"></span>主干路径${m ? '（' + esc(m) + '）' : ''}</span>`)
  } else {
    DATA.lanes.forEach((l, i) => {
      lg.push(`<span class="lg"><span class="ln ${i === 0 ? 'mf' : 'mp'}"></span>第 ${i + 1} 会话主干${l.model ? '（' + esc(l.model) + '）' : ''}</span>`)
    })
  }
  lg.push('<span class="lg"><span class="ln dt"></span>出程：从分支点出发的探索</span>')
  lg.push('<span class="lg"><span class="ln bk"></span>回程：失败后折返分支点</span>')
  lg.push('<span class="lg"><span class="sw er"></span>失败 ✗</span>')
  lg.push('<span class="lg"><span class="sw de"></span>死路/空结果 ·</span>')
  lg.push('<span class="lg"><span class="sw an"></span>最终回答</span>')
  if (DATA.timeMap) lg.push('<span class="lg">⏸ 空闲等待已折叠</span>')
  if (DATA.milestones.length > 0 && DATA.lanes.length === 2) lg.push('<span class="lg"><span class="sw ms"></span>里程碑对比线</span>')
  document.getElementById('legend').innerHTML = lg.join('')
}

function el(name, attrs){
  const n = document.createElementNS(NS, name)
  for (const k in attrs) n.setAttribute(k, attrs[k])
  return n
}

const pathEls = []
const nodeEls = []
const markEls = []
const msEls = []
const labRows = {}
const wEst = s => s.length * 6.2 + 6

function assignLanes(lane){
  let up = 0, down = 0
  lane.detours.forEach((d, i) => {
    if (i % 2 === 0){ up += 1; d._lane = up } else { down += 1; d._lane = -down }
    d._y = LAYOUT[lane.key].mainY + d._lane * LANE_GAP
  })
}

function build(){
  while (svg.firstChild) svg.removeChild(svg.firstChild)
  pathEls.length = 0; nodeEls.length = 0; markEls.length = 0; msEls.length = 0
  for (const k of Object.keys(labRows)) delete labRows[k]
  svg.setAttribute('viewBox', `0 0 1560 ${DATA.viewH}`)

  const defs = el('defs', {})
  defs.appendChild(el('marker', { id: 'arr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }))
      .appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#9aa4b8' }))
  svg.appendChild(defs)

  const TS = tickStep(TMAX)
  const drawTick = (cx, label, big) => {
    const g = el('g', {})
    g.appendChild(el('line', { x1: cx, y1: 0, x2: cx, y2: DATA.viewH, stroke: '#eceff4', 'stroke-width': big ? 1 : 0.5 }))
    const tx = el('text', { x: cx, y: 14, 'text-anchor': 'middle', class: big ? 'tick big' : 'tick' })
    tx.textContent = label
    g.appendChild(tx)
    svg.appendChild(g)
  }
  if (DATA.timeMap){
    // Ticks live inside activity segments and carry wall-clock labels; each
    // collapsed idle gap renders as a hatched seam labeled with the skipped time.
    for (const seg of DATA.timeMap.segments){
      for (let rt = Math.ceil(seg.rs / TS) * TS; rt <= seg.re + 0.001; rt += TS){
        drawTick(x(seg.cs + (rt - seg.rs)), fmtT(rt), (rt / TS) % 2 === 0)
      }
    }
    for (const gp of DATA.timeMap.gaps){
      const x0 = x(gp.c), x1 = x(gp.c + DATA.timeMap.seam)
      svg.appendChild(el('rect', { x: x0, y: 0, width: Math.max(x1 - x0, 3), height: DATA.viewH, fill: '#eef1f6', opacity: 0.85 }))
      svg.appendChild(el('line', { x1: x0, y1: 0, x2: x0, y2: DATA.viewH, stroke: '#c7cedb', 'stroke-dasharray': '3 4' }))
      svg.appendChild(el('line', { x1: x1, y1: 0, x2: x1, y2: DATA.viewH, stroke: '#c7cedb', 'stroke-dasharray': '3 4' }))
      const lb = el('text', { x: (x0 + x1) / 2, y: 14, 'text-anchor': 'middle', class: 'tick big', fill: '#b45309' })
      lb.textContent = '⏸ ' + fmtT(gp.skipped)
      svg.appendChild(lb)
    }
  } else {
    for (let t = 0; t <= TMAX + 0.001; t += TS){
      drawTick(x(t), fmtT(t), (t / TS) % 2 === 0)
    }
  }

  // milestone comparison lines (2 lanes only)
  if (DATA.milestones.length > 0 && DATA.lanes.length === 2){
    const y1 = LAYOUT[DATA.lanes[0].key].mainY, y2 = LAYOUT[DATA.lanes[1].key].mainY
    for (const m of DATA.milestones){
      const g = el('g', {})
      g.appendChild(el('line', { x1: x(m.flashT), y1: y1, x2: x(m.proT), y2: y2, class: 'msline' }))
      const t1 = el('text', { x: x(m.flashT) + 6, y: y1 - 6, class: 'mk-flag', fill: '#2563eb' }); t1.textContent = '⚑'
      const t2 = el('text', { x: x(m.proT) - 6, y: y2 - 6, class: 'mk-flag', fill: '#7c3aed', 'text-anchor': 'end' }); t2.textContent = '⚑'
      g.appendChild(t1); g.appendChild(t2)
      const cx = (x(m.flashT) + x(m.proT)) / 2, cy = (y1 + y2) / 2
      const diff = m.proT - m.flashT
      const lab = el('text', { x: cx, y: cy - 8, 'text-anchor': 'middle', class: 'mslabel' })
      lab.textContent = `${m.label}：1st ${fmtT(m.flashT)} ↔ 2nd ${fmtT(m.proT)}（+${fmtT(Math.abs(diff))}）`
      g.appendChild(lab)
      const r1 = el('circle', { cx: x(m.flashT), cy: y1, r: 12, fill: 'none', stroke: '#d97706', 'stroke-width': 2 })
      const r2 = el('circle', { cx: x(m.proT), cy: y2, r: 12, fill: 'none', stroke: '#d97706', 'stroke-width': 2 })
      g.appendChild(r1); g.appendChild(r2)
      msEls.push({ el: g, s: Math.max(m.flashT, m.proT) })
      svg.appendChild(g)
    }
  }

  DATA.lanes.forEach(lane => {
    assignLanes(lane)
    const lay = LAYOUT[lane.key]
    const mainC = MAIN_COLOR[lane.key]
    const isFlash = lane.key === 'l1'
    const bgFill = isFlash ? 'rgba(37,99,235,0.045)' : 'rgba(124,58,237,0.045)'
    const bgStr = isFlash ? 'rgba(37,99,235,0.20)' : 'rgba(124,58,237,0.20)'
    const barFill = isFlash ? 'rgba(37,99,235,0.09)' : 'rgba(124,58,237,0.09)'
    svg.appendChild(el('rect', { x: X0 - 14, y: lay.regionTop, width: AXIS_W + 28, height: lay.regionBottom - lay.regionTop, rx: 10, fill: bgFill, stroke: bgStr, 'stroke-width': 1.2 }))
    svg.appendChild(el('rect', { x: X0 - 14, y: lay.regionTop, width: AXIS_W + 28, height: 30, rx: 10, fill: barFill }))
    svg.appendChild(el('rect', { x: X0 - 14, y: lay.regionTop + 15, width: AXIS_W + 28, height: 15, fill: barFill }))
    const title = el('text', { x: X0 + 4, y: lay.regionTop + 20, class: 'lane-name', fill: isFlash ? '#1d4ed8' : '#6d28d9' })
    title.textContent = `${laneName(lane)}   ${lane.model ?? '(未知模型)'}`
    const info = el('text', { x: X0 + AXIS_W - 4, y: lay.regionTop + 20, 'text-anchor': 'end', class: 'lane-info' })
    info.textContent = `${lane.stats.steps} 步（主干 ${lane.stats.main} / 支路 ${lane.stats.detours}）· ${lane.stats.tools} 次工具调用 · reasoning ${lane.stats.rz.toLocaleString()} tok · 总耗时 ${fmtT(lane.stats.T)}`
    svg.appendChild(title); svg.appendChild(info)

    // explore-phase background band
    if (lane.detours.length > 1){
      const x0 = Math.min(...lane.detours.map(d => x(d.s)))
      const x1 = Math.max(...lane.detours.map(d => x(d.e)))
      const band = el('rect', { x: x0, y: lay.mainY - (LAYOUT[lane.key].up * LANE_GAP + 40), width: x1 - x0, height: LAYOUT[lane.key].up * LANE_GAP + LAYOUT[lane.key].down * LANE_GAP + 80, fill: 'rgba(220,38,38,0.035)', stroke: 'rgba(220,38,38,0.16)', 'stroke-dasharray': '2 3' })
      svg.appendChild(band)
      const bt = el('text', { x: x0 + 10, y: lay.mainY - LAYOUT[lane.key].up * LANE_GAP - 14, class: 'band-label' })
      const t0s = Math.min(...lane.detours.map(d => d.s)), t1s = Math.max(...lane.detours.map(d => d.e))
      bt.textContent = `探索期 ${t0s.toFixed(0)}s → ${t1s.toFixed(0)}s（${lane.detours.length} 条支路）`
      svg.appendChild(bt)
    }

    const main = lane.main
    main.forEach((n, i) => {
      if (i > 0){
        const p = el('path', { d: `M ${x(main[i - 1].e)} ${lay.mainY} L ${x(n.e)} ${lay.mainY}`, fill: 'none', stroke: mainC, 'stroke-width': 3, 'stroke-linecap': 'round' })
        svg.appendChild(p)
        pathEls.push({ el: p, s: main[i - 1].e, e: n.e, base: '' })
      }
      const node = drawNode(lane, n, lay.mainY, true, i)
      nodeEls.push({ el: node.g, s: n.e - 4, e: n.e })
    })

    lane.detours.forEach((d, di) => {
      d._id = lane.key + '-d' + di
      d._laneKey = lane.key
      const attach = main.find(n => n.step === d.attach)
      const ax = x(attach ? attach.e : d.s)
      const ay = lay.mainY
      const ex = x(d.e), ey = d._y
      const mx = (ax + ex) / 2
      const vc = d.v === 'error' ? '#dc2626' : (d.v === 'deadend' ? '#9aa4b8' : '#b6c0d2')
      const c1x = ax + 90, c1y = ay + (ey - ay) * 0.38
      const c2x = mx, c2y = ey
      const out = el('path', { d: `M ${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${ex} ${ey}`, fill: 'none', stroke: vc, 'stroke-width': 2.6, 'stroke-dasharray': '6 5' })
      out._det = d
      out.addEventListener('mouseenter', onArcHover)
      out.addEventListener('mouseleave', offArcHover)
      svg.appendChild(out)
      pathEls.push({ el: out, s: d.s, e: d.e, det: d, base: '6 5' })
      const bx = 0.125 * ax + 0.375 * c1x + 0.375 * c2x + 0.125 * ex
      const by = 0.125 * ay + 0.375 * c1y + 0.375 * c2y + 0.125 * ey
      const sl = el('text', { x: bx, y: by - 5, 'text-anchor': 'middle', class: 'seg-label', fill: vc })
      sl.textContent = 'S' + d.step
      sl.style.opacity = 0
      svg.appendChild(sl)
      pathEls.push({ el: sl, s: d.s, e: d.e, det: d, base: '', kind: 'lab' })
      const back = el('path', { d: `M ${ex} ${ey} C ${mx + 30} ${ey}, ${mx + 30} ${ay}, ${ax} ${ay}`, fill: 'none', stroke: '#9aa4b8', 'stroke-width': 1.6, 'stroke-dasharray': '2 4', 'marker-end': 'url(#arr)' })
      back._det = d
      back.addEventListener('mouseenter', onArcHover)
      back.addEventListener('mouseleave', offArcHover)
      svg.appendChild(back)
      pathEls.push({ el: back, s: d.e, e: d.e + 1.5, det: d, base: '2 4' })
      const btl = el('text', { x: mx + 24, y: (ey + ay) / 2 + 4, 'text-anchor': 'end', class: 'back-label' })
      btl.textContent = '↩'
      btl.style.opacity = 0
      svg.appendChild(btl)
      pathEls.push({ el: btl, s: d.e, e: d.e + 1.5, det: d, base: '', kind: 'lab' })
      const node = drawNode(lane, d, ey, false, -1)
      nodeEls.push({ el: node.g, s: d.e - 4, e: d.e })
    })

    const lastN = main[main.length - 1]
    if (lastN){
      const f = el('text', { x: x(lastN.e), y: lay.mainY - 12, 'text-anchor': 'middle', class: 'mk-flag', fill: '#16a34a' })
      f.textContent = '🏁 ' + fmtT(lane.stats.T)
      svg.appendChild(f)
      markEls.push({ el: f, s: lastN.e, e: lastN.e + 1 })
    }
  })

  const cur = el('line', { x1: X0, y1: 0, x2: X0, y2: DATA.viewH, stroke: '#d97706', 'stroke-width': 2 })
  svg.appendChild(cur)
  window._cursor = cur
}

function drawNode(lane, n, y, isMain, idx){
  const g = el('g', { class: 'node' })
  const c = n.v === 'answer' ? VCOLOR.answer : (isMain ? MAIN_COLOR[lane.key] : VCOLOR[n.v])
  const r = isMain ? 10 : 8
  const cx = x(n.e)
  g.appendChild(el('circle', { cx, cy: y, r, fill: c, opacity: '0', 'stroke-width': 1.5, stroke: '#ffffff' }))
  const icon = el('text', { x: cx, y: y + 3.5, 'text-anchor': 'middle', class: 'node-icon', fill: '#fff' })
  if (isMain){
    icon.textContent = n.v === 'answer' ? '' : '✓'
    icon.style.fontSize = n.v === 'answer' ? '0' : '11px'
  } else {
    icon.textContent = n.v === 'error' ? '✗' : (n.v === 'deadend' ? '·' : '○')
    icon.style.fontSize = n.v === 'error' ? '12px' : '13px'
    icon.style.fontWeight = '700'
  }
  g.appendChild(icon)
  const rowKey = isMain ? (idx % 2 ? 'u' : 'd') : ('det-' + (n._id ?? idx))
  const labY = isMain ? y + (idx % 2 ? -15 : 28) : y + 26
  const lab = el('text', { x: cx, y: labY, 'text-anchor': 'middle', class: 'nlabel' })
  let toolTxt = ''
  if (n.v !== 'answer'){
    const t0 = n.tools[0]
    toolTxt = tlabel(t0.name) + (n.tools.length > 1 ? ' +' + (n.tools.length - 1) : '')
  }
  const full = 'S' + n.step + (toolTxt ? ' ' + toolTxt : '')
  const key = lane.key + '-' + rowKey
  const prevEnd = labRows[key] !== undefined ? labRows[key] : -1e9
  if (cx - prevEnd >= wEst(full) + 12){
    lab.textContent = full
    labRows[key] = cx + wEst(full) / 2
  } else if (cx - prevEnd >= 26){
    lab.textContent = 'S' + n.step
    labRows[key] = cx + 10
  } else {
    lab.textContent = ''
  }
  g.appendChild(lab)
  g._node = n; g._lane = lane; g._isMain = isMain; g._y = y; g._det = isMain ? null : n
  g.addEventListener('mouseenter', onHover)
  g.addEventListener('mouseleave', offHover)
  svg.appendChild(g)
  return { g }
}

let hoverDet = null
function onArcHover(e){
  hoverDet = e.currentTarget._det
  showTipFor(hoverDet)
  render()
}
function offArcHover(){
  hoverDet = null
  document.getElementById('tip').style.display = 'none'
  render()
}
function showTipFor(d){
  const lane = d._laneKey === 'l1' ? DATA.lanes[0] : DATA.lanes[1]
  const tip = document.getElementById('tip')
  let inner = `<div class="th">${laneName(lane)} S${d.step} · 探索支路 · ${vlabel(d.v)}${d.v === 'error' ? '（被打回）' : ''}</div>`
  inner += `<div class="rs">时段 ${fmtT(wallClock(d.s))} → ${fmtT(wallClock(d.e))}（${(d.e - d.s).toFixed(1)}s）· reasoning ${d.rz} tok</div>`
  inner += `<div class="back">出程曲线自分支点 S${d.attach} 分叉（x 位置），于 ${fmtT(wallClock(d.s))} → ${fmtT(wallClock(d.e))} 生长完成</div>`
  inner += `<div class="back">↩ 此路不通，折返回分支点（S${d.attach}）</div>`
  d.tools.forEach(t => {
    inner += `<pre><b>${tlabel(t.name)}</b> (${t.dur}s) ${t.v === 'error' ? '✗' : ''}\n${esc(t.args)}</pre>`
    if (t.res) inner += `<div class="rs">返回：<pre>${esc(t.res)}</pre></div>`
  })
  if (d.rzTxt) inner += `<div class="rs">思考摘要：${esc(d.rzTxt)}</div>`
  tip.innerHTML = inner
  tip.style.display = 'block'
}
function onHover(e){
  const g = e.currentTarget, n = g._node
  hoverDet = n._id ? n : null
  render()
  const lane = g._lane
  let inner = `<div class="th">${laneName(lane)} S${n.step} · ${g._isMain ? (n.v === 'answer' ? '最终回答' : '主干推进') : '探索支路'} · ${vlabel(n.v)}${n.v === 'error' ? '（被打回）' : ''}</div>`
  if (n.v !== 'answer'){
    inner += `<div class="rs">时段 ${fmtT(wallClock(n.s))} → ${fmtT(wallClock(n.e))}（${(n.e - n.s).toFixed(1)}s）· reasoning ${n.rz} tok</div>`
    if (!g._isMain) inner += `<div class="back">↩ 此路不通，折返回分支点（S${n.attach}）</div>`
    if (g._nAtt) inner += `<div class="back">⦿ 分支原点：${g._nAtt} 条探索支路从这里出发并折返</div>`
    n.tools.forEach(t => {
      inner += `<pre><b>${tlabel(t.name)}</b> (${t.dur}s) ${t.v === 'error' ? '✗' : ''}\n${esc(t.args)}</pre>`
      if (t.res) inner += `<div class="rs">返回：<pre>${esc(t.res)}</pre></div>`
    })
    if (n.rzTxt) inner += `<div class="rs">思考摘要：${esc(n.rzTxt)}</div>`
  }
  const tip = document.getElementById('tip')
  tip.innerHTML = inner
  tip.style.display = 'block'
  let px = e.clientX + 14, py = e.clientY + 14
  if (px + 640 > window.innerWidth) px = e.clientX - 640
  if (py + 400 > window.innerHeight) py = e.clientY - 400
  tip.style.left = px + 'px'; tip.style.top = py + 'px'
}
function offHover(){
  hoverDet = null
  document.getElementById('tip').style.display = 'none'
  render()
}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

/* ============================ 动画 ============================ */
let t = 0, playing = false, timer = 0, lastTs = 0
const speedSel = document.getElementById('speed')
const curTimeEl = document.getElementById('curTime')
const seekEl = document.getElementById('seek')
function prog(s, e){ return (t - s) / (e - s) }

function render(){
  pathEls.forEach(({ el, s, e, det, base, kind }) => {
    const p = prog(s, e)
    const len = el.getTotalLength ? el.getTotalLength() : 100
    if (p >= 1){
      el.setAttribute('stroke-dasharray', base || '')
      el.setAttribute('stroke-dashoffset', '0')
    } else {
      el.setAttribute('stroke-dasharray', len)
      el.setAttribute('stroke-dashoffset', len * (1 - Math.max(0, p)))
    }
    if (det){
      const hit = hoverDet && det._id === hoverDet._id
      if (kind === 'lab'){
        el.style.opacity = hit ? 1 : 0
      } else if (hoverDet){
        el.style.opacity = hit ? 1 : 0.12
        el.classList.toggle('hl-path', hit)
      } else {
        el.style.opacity = t >= s ? 1 : 0.25
        el.classList.remove('hl-path')
      }
    } else {
      el.style.opacity = t >= s ? 1 : 0.25
    }
  })
  nodeEls.forEach(({ el, s, e }) => {
    const p = prog(s, e)
    const cs = el.querySelectorAll('circle')
    const op = t < s ? 0 : (t < e ? 0.3 + 0.7 * p : 1)
    cs.forEach(c => c.setAttribute('opacity', op))
    if (el._det && hoverDet){
      el.style.opacity = el._det._id === hoverDet._id ? 1 : 0.18
      el.classList.toggle('hl-node', el._det._id === hoverDet._id)
    } else {
      el.style.opacity = t >= s ? 1 : 0.3
      el.classList.remove('hl-node')
    }
  })
  markEls.forEach(({ el, s, e }) => {
    el.style.opacity = t >= s ? 1 : 0
    if (t >= s && t < e) el.style.opacity = (t * 30) % 2 < 1 ? 1 : 0.15
  })
  msEls.forEach(({ el, s }) => { el.style.opacity = t >= s ? 1 : 0 })
  window._cursor.setAttribute('x1', x(t))
  window._cursor.setAttribute('x2', x(t))
  curTimeEl.textContent = fmtT(wallClock(t))
  seekEl.value = Math.round(t / TMAX * 1000)
}
function tick(){
  if (!playing) return
  const now = Date.now()
  if (!lastTs) lastTs = now
  const dt = (now - lastTs) / 1000 * parseFloat(speedSel.value)
  lastTs = now
  t = Math.min(t + dt, TMAX)
  render()
  if (t >= TMAX){ playing = false; btnPlay.textContent = '▶ 重播' }
}
const btnPlay = document.getElementById('btnPlay')
btnPlay.addEventListener('click', () => {
  if (t >= TMAX) t = 0
  playing = !playing
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放'
  lastTs = 0
  if (playing && !timer) timer = setInterval(tick, 16)
  else if (!playing && timer){ clearInterval(timer); timer = 0 }
})
document.getElementById('btnReset').addEventListener('click', () => {
  playing = false
  if (timer){ clearInterval(timer); timer = 0 }
  btnPlay.textContent = '▶ 播放'
  t = 0; render()
})
seekEl.addEventListener('input', () => {
  t = parseFloat(seekEl.value) / 1000 * TMAX
  render()
})

/* ============================ 上传 ============================ */
let DATA = null
const drop = document.getElementById('drop')
const fileInput = document.getElementById('file')
const filesBox = document.getElementById('files')
const errbar = document.getElementById('errbar')
const loaded = []   // {name, text}

function showErr(msg){
  errbar.textContent = msg
  errbar.style.display = 'block'
}
function clearErr(){ errbar.style.display = 'none' }

function renderFiles(){
  filesBox.innerHTML = ''
  loaded.forEach((f, i) => {
    const chip = document.createElement('span')
    chip.className = 'fchip'
    chip.innerHTML = `<span>${esc(f.name)}</span><span class="x" data-i="${i}">×</span>`
    chip.querySelector('.x').addEventListener('click', () => {
      loaded.splice(i, 1)
      renderFiles()
      if (loaded.length === 0) resetView()
      else apply()
    })
    filesBox.appendChild(chip)
  })
}

function resetView(){
  document.getElementById('legend').style.display = 'none'
  document.getElementById('controls').style.display = 'none'
  document.getElementById('svgwrap').style.display = 'none'
  document.getElementById('stats').innerHTML = ''
  while (svg.firstChild) svg.removeChild(svg.firstChild)
}

function apply(){
  clearErr()
  let data
  try {
    data = buildData(loaded.map(f => f.text))
  } catch (e){
    showErr('解析失败：' + (e.message ?? e))
    resetView()
    return
  }
  renderData(data, { follow: false })
}

/** Render a fully-built maze data payload (upload mode or live mode). */
function renderData(data, opts){
  opts = opts ?? {}
  DATA = data
  compressTimeline(DATA)
  TMAX = DATA.Tmax
  LAYOUT = computeLayout(DATA.lanes)
  DATA.viewH = Math.max(...DATA.lanes.map(l => LAYOUT[l.key].regionBottom)) + 30
  renderLegend()
  let h = ''
  DATA.lanes.forEach(l => {
    h += `<div class="card"><div><b>${laneName(l)}</b> <span class="key">${esc(l.model ?? '未知模型')}</span></div>
      <div class="m">主干 ${l.stats.main} 步 + 支路 ${l.stats.detours} 步 = ${l.stats.steps} 步 · ${l.stats.tools} 次工具调用 · reasoning ${l.stats.rz.toLocaleString()} tok · 总耗时 <b>${fmtT(l.stats.T)}</b></div></div>`
  })
  document.getElementById('stats').innerHTML = h
  document.getElementById('legend').style.display = 'flex'
  document.getElementById('controls').style.display = 'flex'
  document.getElementById('svgwrap').style.display = 'block'
  playing = false
  if (timer){ clearInterval(timer); timer = 0 }
  btnPlay.textContent = '▶ 播放'
  t = opts.follow ? TMAX : 0
  build()
  render()
}

drop.addEventListener('click', () => fileInput.click())
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover') })
drop.addEventListener('dragleave', () => drop.classList.remove('hover'))
drop.addEventListener('drop', e => {
  e.preventDefault()
  drop.classList.remove('hover')
  handleFiles([...e.dataTransfer.files])
})
fileInput.addEventListener('change', () => {
  handleFiles([...fileInput.files])
  fileInput.value = ''
})

const ZSTD_MAGIC = [0x28, 0xb5, 0x2f, 0xfd]

/** Whether this browser's DecompressionStream understands 'zstd', probed once at load. */
const NATIVE_ZSTD = (() => {
  try { new DecompressionStream('zstd'); return true } catch { return false }
})()

/** zstd bytes → text: native DecompressionStream where available, bundled fzstd otherwise. */
async function unzstd(buf){
  if (NATIVE_ZSTD) return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('zstd'))).text()
  if (typeof fzstd !== 'undefined') return new TextDecoder().decode(fzstd.decompress(buf))
  throw new Error('此浏览器不支持 zstd 解压，请先在终端执行 zstd -d 解压后上传 .jsonl')
}

/** File → decoded text; zstd frames (session.jsonl.zstd) are detected by magic bytes and decompressed. */
async function decodeFile(f){
  const buf = new Uint8Array(await f.arrayBuffer())
  const isZstd = buf.length >= 4 && ZSTD_MAGIC.every((b, i) => buf[i] === b)
  return isZstd ? await unzstd(buf) : new TextDecoder().decode(buf)
}

async function handleFiles(files){
  if (files.length === 0) return
  if (loaded.length + files.length > 2){
    showErr('最多上传 2 个 session log')
    return
  }
  clearErr()
  let failed = false
  for (const f of files){
    try {
      loaded.push({ name: f.name, text: await decodeFile(f) })
    } catch (e){
      failed = true
      showErr('读取文件失败：' + f.name + '（' + (e.message ?? e) + '）')
    }
  }
  renderFiles()
  if (loaded.length > 0 && !failed) apply()
}

/* ===== Live mode: parent frame pushes rendered maze data via postMessage ===== */
let liveMode = false
window.addEventListener('message', e => {
  if (!e.data || e.data.kind !== 'trace-maze') return
  liveMode = true
  drop.style.display = 'none'
  filesBox.style.display = 'none'
  document.body.classList.add('live')
  renderData(e.data.data, { follow: true })
})

/* URL-direct load hook: ?load1=<path>&load2=<path> (dev/embed convenience). */
;(async () => {
  const params = new URLSearchParams(location.search)
  const paths = [params.get('load1'), params.get('load2')].filter(Boolean)
  for (const p of paths){
    try {
      const r = await fetch(p)
      const text = await r.text()
      loaded.push({ name: p.split('/').pop() ?? p, text })
    } catch (e){
      showErr('URL 加载失败：' + p + '（' + (e.message ?? e) + '）')
    }
  }
  if (loaded.length > 0){
    renderFiles()
    apply()
  }
})()
</script>
